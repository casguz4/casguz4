name: Generate profile summary cards

on:
  # Rebuild once a day. No push trigger: this workflow commits back to
  # master, which would otherwise retrigger itself.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-summary-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-summary-cards
    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # Uses a personal access token when one is set, otherwise falls
          # back to the token GitHub provides the workflow. The PAT is only
          # needed to fold private activity into the totals.
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "master"
          THEME: "tokyonight"
          UTC_OFFSET: -5
          AUTO_PUSH: true
