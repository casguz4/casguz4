name: Generate snake animation

on:
  schedule:
    # Every 12 hours, so the snake stays in sync with recent commits.
    - cron: "0 */12 * * *"
  push:
    branches:
      - master
  workflow_dispatch:

# Allow the job to push the generated SVGs to the output branch.
permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake from the contribution graph
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light
            dist/snake-dark.svg?palette=github-dark
            dist/snake.gif?color_snake=#94e2d5&color_dots=#1e1e2e,#45475a,#585b70,#94e2d5,#cba6f7

      - name: Push generated files to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
